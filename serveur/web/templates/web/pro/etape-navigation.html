{% comment %}Boutons « Précédent » / « Suivant » d'une étape de l'éditeur (js/etapes-annonce.js). Paramètres : precedent, suivant,
desactive (« Suivant » grisé tant que l'étape n'est pas complète).{% endcomment %}
<div class="etape__navigation">
  {% if precedent %}
    <button class="bouton bouton--secondaire"
            type="button"
            data-aller="{{ precedent }}">Précédent</button>
  {% else %}
    <span></span>
  {% endif %}
  {% if suivant %}
    <button class="bouton bouton--primaire"
            type="button"
            data-aller="{{ suivant }}"
            data-verifier{% if desactive %}
            disabled
            aria-disabled="true"
            {% endif %}>
      Suivant
      {% include "web/composants/icone.html" with nom="arrow-right" taille=18 %}
    </button>
  {% endif %}
</div>
