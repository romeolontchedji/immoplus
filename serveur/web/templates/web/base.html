{% load i18n logeo %}
<!DOCTYPE html>
<html lang="fr">
  <head>
    <meta charset="utf-8">
    <meta name="viewport"
          content="width=device-width, initial-scale=1, viewport-fit=cover">
    <meta name="color-scheme" content="light dark">
    <title>{% block titre %}Logeo — Trouve ta chambre à Parakou{% endblock %}</title>
    <meta name="description"
          content="{% block description %}Trouve ta chambre à Parakou : vidéos réelles, gérants vérifiés, messagerie sûre.{% endblock %}">
    <link rel="stylesheet" href="{% css_logeo %}">
    {% block tete %}{% endblock %}
  </head>
  <body>
    <a class="lien-evitement" href="#contenu">Aller au contenu</a>
    <div class="page">
      <header class="entete">
        <div class="conteneur entete__barre">
          <a class="logotype" href="/">Logeo<span class="logotype__point">.</span></a>
          {% block navigation %}
            {% include "web/composants/navigation.html" %}
          {% endblock %}
        </div>
      </header>
      <main id="contenu" class="page__contenu">
        {% block contenu %}{% endblock %}
      </main>
      <footer class="pied">
        <div class="conteneur">© Logeo — Parakou, Bénin</div>
      </footer>
    </div>
  </body>
</html>
