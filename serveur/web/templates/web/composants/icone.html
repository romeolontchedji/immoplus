{# Icônes Lucide (trait 2). Usage : {% include "web/composants/icone.html" with nom="x" taille=16 %} #}
<svg class="icone"
     width="{{ taille|default:20 }}"
     height="{{ taille|default:20 }}"
     viewBox="0 0 24 24"
     fill="none"
     stroke="currentColor"
     stroke-width="2"
     stroke-linecap="round"
     stroke-linejoin="round"
     aria-hidden="true"
     focusable="false">
  {% if nom == "x" %}
    <path d="M18 6 6 18" />
    <path d="m6 6 12 12" />
  {% elif nom == "search" %}
    <circle cx="11" cy="11" r="8" />
    <path d="m21 21-4.3-4.3" />
  {% elif nom == "circle-help" %}
    <circle cx="12" cy="12" r="10" />
    <path d="M9.09 9a3 3 0 0 1 5.83 1c0 2-3 3-3 3" />
    <path d="M12 17h.01" />
  {% elif nom == "heart" %}
    <path d="M20.84 4.61a5.5 5.5 0 0 0-7.78 0L12 5.67l-1.06-1.06a5.5 5.5 0 0 0-7.78 7.78l1.06 1.06L12 21.23l7.78-7.78 1.06-1.06a5.5 5.5 0 0 0 0-7.78z" />
  {% elif nom == "chevron-up" %}
    <path d="m18 15-6-6-6 6" />
  {% elif nom == "chevron-down" %}
    <path d="m6 9 6 6 6-6" />
  {% elif nom == "smartphone" %}
    <rect width="14" height="20" x="5" y="2" rx="2" ry="2" />
    <path d="M12 18h.01" />
  {% endif %}
</svg>
