{% extends "admin/base_site.html" %}

{% block content %}
  <div id="content-main">
    <h1>Créer un gérant</h1>
    <div class="module">
      <h2>Nouveau compte gérant</h2>
      <div class="lg-section">
        <form method="post" novalidate>
          {% csrf_token %}
          {{ form.as_p }}
          <p class="help">Un mot de passe est attribué par défaut. Le gérant doit le modifier à sa première connexion depuis la plateforme.</p>
          <div class="lg-section__actions">
            <input type="submit" value="Créer le compte gérant" class="default">
            <a href="{% url 'admin:accounts_gerantprofile_changelist' %}">Annuler</a>
          </div>
        </form>
      </div>
    </div>
  </div>
{% endblock %}
