name: verifier
on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: verifier-${{ github.ref }}
  cancel-in-progress: true

env:
  LOGEO_STRICT: "1"
  DB_HOST: localhost
  DB_NAME: logeo
  DB_USER: logeo_ci
  DB_PASSWORD: logeo-ci
  REDIS_QUEUE_URL: redis://localhost:6379/1
  REDIS_CACHE_URL: redis://localhost:6379/0

jobs:
  verifier:
    runs-on: ubuntu-24.04
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: logeo_ci
          POSTGRES_PASSWORD: logeo-ci
          POSTGRES_DB: logeo
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U logeo_ci" --health-interval 5s --health-timeout 3s --health-retries 20
      redis:
        image: redis:7
        ports: ["6379:6379"]
        options: >-
          --health-cmd "redis-cli ping" --health-interval 5s --health-timeout 3s --health-retries 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: serveur/requirements/dev.txt
      - run: sudo apt-get update && sudo apt-get install -y --no-install-recommends ffmpeg libheif1
      - run: pip install -r serveur/requirements/dev.txt
      - name: Contrôles (format, hygiène, noms, lint, imports, tests)
        run: outils/verifier_tout.sh
      - name: Couverture
        run: cd serveur && python -m pytest -q --cov=apps --cov=web --cov=config --cov-fail-under=85
      - name: Preuve des hooks Git
        run: bash outils/tester_hooks.sh
      - name: Audit des dépendances
        run: pip-audit -r serveur/requirements/base.txt --strict --no-deps --disable-pip

  image:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Construction de l'image
        run: docker build -f infra/docker/Dockerfile -t logeo-serveur:ci .
      - name: Validation de la configuration Compose
        run: |
          python3 outils/creer_env.py
          docker compose --env-file .env -f infra/compose/docker-compose.yml --profile dev config -q
      - name: Validation des Caddyfile
        run: |
          docker run --rm -e DOMAIN=exemple.org -v "$PWD/infra/caddy:/etc/caddy:ro" caddy:2 caddy validate --config /etc/caddy/Caddyfile
          docker run --rm -v "$PWD/infra/caddy:/etc/caddy:ro" caddy:2 caddy validate --config /etc/caddy/Caddyfile.local
